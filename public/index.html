<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PR Review Convergence</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>PR Review Convergence</h1>
    <p class="sub">Drive GitHub pull requests to convergence against an automated reviewer.</p>
  </header>

  <section class="submit">
    <form id="submit-form">
      <input id="pr-input" type="text" placeholder="owner/repo#123  or  https://github.com/owner/repo/pull/123" autocomplete="off" />
      <button type="submit">Submit PR</button>
    </form>
    <p id="submit-msg" class="msg"></p>
  </section>

  <nav class="tabs">
    <button data-scope="active" class="tab active">Converging</button>
    <button data-scope="history" class="tab">History</button>
  </nav>

  <main id="list" class="list"><p class="empty">Loading…</p></main>

  <footer><span id="status-line"></span></footer>

  <script src="/app.js" type="module"></script>
</body>
</html>
